name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  version-sync:
    name: Version Sync Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check version sync
        run: node scripts/check-version-sync.js

  rust:
    name: Rust
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: cli

      - name: Format check
        run: cargo fmt --manifest-path cli/Cargo.toml -- --check

      - name: Clippy check
        run: cargo clippy --manifest-path cli/Cargo.toml -- -D warnings

      - name: Run Rust tests
        run: cargo test --profile ci --manifest-path cli/Cargo.toml

  native-e2e:
    name: Native E2E Tests
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    needs: rust
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: cli

      - name: Install Chrome
        run: |
          cargo run --manifest-path cli/Cargo.toml -- install --with-deps

      - name: Run e2e tests
        run: cargo test --profile ci --manifest-path cli/Cargo.toml e2e -- --ignored --test-threads=1

  build-and-upload:
    name: Build & Upload Binary (Linux glibc 2.28)
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    # 继续使用 Debian Buster 容器保证 glibc 2.28 兼容性
    container:
      image: rust:buster
    needs: rust
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-gnu

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: cli

      - name: Build Rust CLI
        run: cargo build --release --manifest-path cli/Cargo.toml --target x86_64-unknown-linux-gnu

      - name: Copy CLI binary to bin directory
        run: |
          mkdir -p bin
          cp cli/target/x86_64-unknown-linux-gnu/release/agent-browser bin/agent-browser-linux-x64

      # 新增：将二进制文件上传到 GitHub Artifacts
      - name: Upload binary artifact
        uses: actions/upload-artifact@v4
        with:
          name: agent-browser-linux-x64
          path: bin/agent-browser-linux-x64
          retention-days: 30 # 产物保留天数，最高可设为 90
