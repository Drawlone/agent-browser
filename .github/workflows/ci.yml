name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  version-sync:
    name: Version Sync Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check version sync
        run: node scripts/check-version-sync.js

  rust:
    name: Rust
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: cli

      - name: Format check
        run: cargo fmt --manifest-path cli/Cargo.toml -- --check

      - name: Clippy check
        run: cargo clippy --manifest-path cli/Cargo.toml -- -D warnings

      - name: Run Rust tests
        run: cargo test --profile ci --manifest-path cli/Cargo.toml

  native-e2e:
    name: Native E2E Tests
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    needs: rust
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: cli

      - name: Install Chrome
        run: |
          cargo run --manifest-path cli/Cargo.toml -- install --with-deps

      - name: Run e2e tests
        run: cargo test --profile ci --manifest-path cli/Cargo.toml e2e -- --ignored --test-threads=1

  global-install:
    name: Global Install (Linux glibc 2.28)
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    # 使用 Debian Buster 容器，它的原生 glibc 版本正是 2.28
    container:
      image: rust:buster
    needs: rust
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-gnu

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: cli

      - name: Build Rust CLI
        run: cargo build --release --manifest-path cli/Cargo.toml --target x86_64-unknown-linux-gnu

      - name: Copy CLI binary to bin directory
        run: cp cli/target/x86_64-unknown-linux-gnu/release/agent-browser bin/agent-browser-linux-x64

      - name: Test npm global install
        run: |
          npm pack
          npm install -g agent-browser-*.tgz
          agent-browser --version
        shell: bash

      - name: Verify symlink points to native binary
        run: |
          SYMLINK=$(npm prefix -g)/bin/agent-browser
          TARGET=$(readlink "$SYMLINK")
          echo "Symlink: $SYMLINK"
          echo "Target: $TARGET"
          if [[ "$TARGET" != *"agent-browser-linux-x64"* ]]; then
            echo "ERROR: Symlink should point to native binary, not JS wrapper"
            exit 1
          fi
          echo "Symlink correctly points to native binary"
        shell: bash
